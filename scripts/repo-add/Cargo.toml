[package]
name = "repo-add"
version = "0.0.1"
authors = ["Vladislav Nepogodin <nepogodin.vlad@gmail.com>"]
license = "GPLv3"
edition = "2024"

[dependencies]
log = { version = "0.4", default-features = false }
subprocess = { version = "0.2", default-features = false }
lazy_static = { version = "1", default-features = false }
akv = { git = "https://github.com/vnepogodin/akv.git", rev = "9404b327c3f6d4f1c3a7f921f4c996712170a181", default-features = false }
fern = { version = "0.7", features = ["colored"], default-features = false }
rand = { version = "0.9", features = ["std", "std_rng", "thread_rng"], default-features = false }
path-absolutize = { version = "3", default-features = false }
rayon = { version = "1.11", default-features = false }
sha2 = { version = "0.10", features = ["std"], default-features = false }
base64 = { version = "0.22", features = ["std"], default-features = false }
fs_extra = { version = "1.3", default-features = false }
signal-hook = { version = "0.4", features = ["iterator"], default-features = false }
rusqlite = { version = "0.38", features = ["bundled", "cache"], default-features = false }
anyhow = { version = "1.0", features = ["std"], default-features = false }
alpm = { version = "5", features = ["checkver"], default-features = false }

[profile.release]
strip = "symbols"
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
